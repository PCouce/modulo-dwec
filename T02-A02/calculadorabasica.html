<!doctype html>
<html>
    <head lang="en">
        <meta charset="UTF-8" />
        <title>CALCULADORA</title>

        <style type="text/css">
            #calculadora {
                background: gray;
                border: 0;
            }
            #calculadora td {
                padding: 4px;
            }
            .cajita_valor {
                background-color: #acff38;
                color: #467702;
                border: 1px solid #454545;
                width: 130px;
                height: 26px;
                font-family: Arial, Helvetica;
                font-size: 20px;
                line-height: 26 px;
                text-align: right;
            }
            .boton {
                width: 24px;
                border: 1px solid #000;
                font-family: Arial;
                font-size: 12px;
                cursor: hand;
                background-color: #fff;
            }
            .boton_largo {
                width: 62px;
                border: 1px solid #000;
                font-family: Arial;
                font-size: 12px;
                cursor: hand;
                background-color: #fff;
            }
            .funcion {
                font-weight: bold;
                color: #b00;
            }
        </style>
    </head>
    <body>
        <table id="calculadora">
            <tr>
                <td colspan="4">
                    <input
                        type="text"
                        id="valor_numero"
                        maxlength="20"
                        value="0"
                        class="cajita_valor"
                        readonly="true"
                    />
                </td>
            </tr>
            <tr>
                <td colspan="2">
                    <input
                        type="Button"
                        id="potencia"
                        value="exp"
                        class="boton_largo funcion"
                        onclick="operar(5)"
                    />
                </td>
                <td>
                    <input
                        type="Button"
                        id="Dividir"
                        value="/"
                        class="boton funcion"
                        onclick="operar(4)"
                    />
                </td>
                <td>
                    <input
                        type="Button"
                        id="Multiplicar"
                        value="x"
                        class="boton funcion"
                        onclick="operar(3)"
                    />
                </td>
            </tr>
            <tr>
                <td>
                    <input
                        type="Button"
                        id="7"
                        value="7"
                        class="boton"
                        onclick="darNumero(7)"
                    />
                </td>
                <td>
                    <input
                        type="Button"
                        id="8"
                        value="8"
                        class="boton"
                        onclick="darNumero(8)"
                    />
                </td>
                <td>
                    <input
                        type="Button"
                        id="9"
                        value="9"
                        class="boton"
                        onclick="darNumero(9)"
                    />
                </td>
                <td>
                    <input
                        type="Button"
                        id="Restar"
                        value="-"
                        class="boton funcion"
                        onclick="operar(2)"
                    />
                </td>
            </tr>
            <tr>
                <td>
                    <input
                        type="Button"
                        id="4"
                        value="4"
                        class="boton"
                        onclick="darNumero(4)"
                    />
                </td>
                <td>
                    <input
                        type="Button"
                        id="5"
                        value="5"
                        class="boton"
                        onclick="darNumero(5)"
                    />
                </td>
                <td>
                    <input
                        type="Button"
                        id="6"
                        value="6"
                        class="boton"
                        onclick="darNumero(6)"
                    />
                </td>
                <td>
                    <input
                        type="Button"
                        id="Sumar"
                        value="+"
                        class="boton funcion"
                        onclick="operar(1)"
                    />
                </td>
            </tr>
            <tr>
                <td>
                    <input
                        type="Button"
                        id="1"
                        value="1"
                        class="boton"
                        onclick="darNumero(1)"
                    />
                </td>
                <td>
                    <input
                        type="Button"
                        id="2"
                        value="2"
                        class="boton"
                        onclick="darNumero(2)"
                    />
                </td>
                <td>
                    <input
                        type="Button"
                        id="3"
                        value="3"
                        class="boton"
                        onclick="darNumero(3)"
                    />
                </td>
                <td>
                    <input
                        type="Button"
                        id="EsIgual"
                        value="="
                        class="boton funcion"
                        onclick="esIgual()"
                    />
                </td>
            </tr>
            <tr>
                <td colspan="2">
                    <input
                        type="Button"
                        id="0"
                        value="0"
                        class="boton_largo"
                        onclick="darNumero(0)"
                    />
                </td>
                <td>
                    <input
                        type="Button"
                        id=","
                        value=","
                        class="boton"
                        onclick="darComa()"
                    />
                </td>
                <td>
                    <input
                        type="Button"
                        id="C"
                        value="C"
                        class="boton funcion"
                        onclick="darC()"
                    />
                </td>
            </tr>
        </table>
        <script>
            // Variables globales
            let resultadoActual = "0";
            let operando = null;
            let operacionSeleccionada = null;
            let limpiarPantalla = false; // Flag para saber cuándo limpiar la pantalla al escribir el 2º operando

            console.log("Este es mi primer JavaScript");

            function darNumero(numero) {
                let strNumero = String(numero);

                // Si venimos de pulsar un operador, limpiamos la pantalla para el nuevo número
                if (resultadoActual === "0" || limpiarPantalla) {
                    resultadoActual = strNumero;
                    limpiarPantalla = false;
                } else {
                    resultadoActual += strNumero;
                }

                refrescar();
            }

            function darComa() {
                if (limpiarPantalla) {
                    resultadoActual = "0,";
                    limpiarPantalla = false;
                } else if (!resultadoActual.includes(",")) {
                    resultadoActual += ",";
                }

                refrescar();
            }

            function darC() {
                resultadoActual = "0";
                operando = null;
                operacionSeleccionada = null;
                limpiarPantalla = false;

                refrescar();
            }

            function operar(valor) {
                console.log("La operación es : ", valor);
                operando = resultadoActual;
                operacionSeleccionada = valor;
                limpiarPantalla = true; // El próximo número que se ingrese limpiará el display
            }

            function esIgual() {
                if (operando === null || operacionSeleccionada === null) return;

                console.log("Valor operando1: ", operando);
                console.log("Operación seleccionada:", operacionSeleccionada);

                let num1 = parseFloat(operando.replace(",", "."));
                let num2 = parseFloat(resultadoActual.replace(",", "."));
                console.log("Valor operando2 : ", num2);

                let resultado = 0;

                switch (operacionSeleccionada) {
                    case 1: // suma
                        resultado = num1 + num2;
                        break;
                    case 2: // resta
                        resultado = num1 - num2;
                        break;
                    case 3: // multiplicación
                        resultado = num1 * num2;
                        break;
                    case 4: // división
                        if (num2 === 0) {
                            resultadoActual = "Error";
                            refrescar();
                            return;
                        }
                        resultado = num1 / num2;
                        break;
                    case 5: // potencia
                        resultado = Math.pow(num1, num2);
                        break;
                }

                // Formatear el resultado devolviendo coma decimal
                resultadoActual = String(resultado).replace(".", ",");

                // Resetear operaciones para el siguiente cálculo
                operando = null;
                operacionSeleccionada = null;
                limpiarPantalla = true;

                refrescar();
            }

            function refrescar() {
                document.getElementById("valor_numero").value = resultadoActual;
            }
        </script>
    </body>
</html>
